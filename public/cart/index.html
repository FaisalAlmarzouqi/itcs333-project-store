<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Campus Marketplace</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    header { padding: 16px 24px; border-bottom: 2px solid #1a4f8a; display: flex; justify-content: space-between; align-items: center; }
    nav a { margin-right: 12px; text-decoration: none; color: #1a4f8a; font-weight: bold; }
    main { padding: 24px; max-width: 900px; }
    .error-banner { background: #fdecea; color: #b71c1c; border: 1px solid #f5c6c0; padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    .qty-input { width: 65px; padding: 4px; }
    button { padding: 6px 10px; cursor: pointer; margin-right: 4px; }
    .total-box { margin-top: 16px; font-size: 1.15rem; font-weight: bold; }
    .add-box { margin-top: 20px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Shopping Cart</h1>
    <nav id="nav">
      <a href="../index.html">Products</a>
      <a href="index.html">Cart</a>
    </nav>
  </header>

  <main>
    <div id="error-banner" class="error-banner" role="alert"></div>

    <section id="cart-app">
      <h2>Your Cart Items</h2>
      <div id="cart-status"></div>
      <table>
        <thead>
          <tr>
            <th>Line ID</th>
            <th>Product ID</th>
            <th>Unit Price</th>
            <th>Qty</th>
            <th>Subtotal</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="cart-rows"></tbody>
      </table>
      <div id="cart-total" class="total-box">Total: $0.00</div>

      <div class="add-box">
        <h3>Add Product by ID</h3>
        <label>Product ID: <input type="number" id="add-product-id" min="1" value="1"></label>
        <label>Qty: <input type="number" id="add-qty" min="1" value="1"></label>
        <button type="button" id="add-cart-btn">Add to Cart</button>
      </div>
    </section>
  </main>

  <script src="../app.js"></script>
  <script src="cart.js"></script>
</body>
</html>
